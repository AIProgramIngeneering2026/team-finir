openapi: 3.0.3
info:
  title: VulnScout API
  version: 0.1.0
  description: |
    Проверка зависимостей проекта на известные уязвимости (CVE) по базе OSV.dev.

    Скан выполняется в фоне: `POST /v1/scans` сразу возвращает идентификатор,
    результат читается через `GET /v1/scans/{id}`.

    Все ошибки возвращаются в едином формате `Error`: машиночитаемый код,
    сообщение для человека и, если ошибка связана с конкретным полем, его имя в `details.field`.
servers:
  - url: http://localhost:8080

tags:
  - name: scans
  - name: health

paths:
  /v1/scans:
    post:
      tags: [scans]
      operationId: createScan
      summary: Создать скан манифеста
      description: |
        Принимает манифест зависимостей и ставит скан в очередь.

        **Идемпотентность.** Если передан `Idempotency-Key`, повтор запроса с тем же ключом
        в рамках того же `project` в течение 24 часов не создаёт новый скан, а возвращает
        существующий с кодом `200`. Тот же ключ с другим телом запроса — `422`.
        Без ключа каждый запрос создаёт новый скан.

        Проверки размера и формата выполняются до создания скана: при ошибке скан не создаётся.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [project, file]
              properties:
                project:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '^[A-Za-z0-9._-]+$'
                  description: Имя проекта. Группирует сканы в истории и задаёт область действия Idempotency-Key.
                  example: payments-api
                file:
                  type: string
                  format: binary
                  description: |
                    Манифест зависимостей не больше 1 МБ.
                    Поддерживаются имена файлов `go.mod` и `package-lock.json`.
      responses:
        '202':
          description: Скан создан и поставлен в очередь.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanCreated'
        '200':
          description: Повтор с тем же Idempotency-Key — возвращён уже созданный скан.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            Idempotent-Replayed:
              description: Всегда `true` — ответ на повторный запрос.
              schema:
                type: string
                enum: ['true']
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanCreated'
        '400':
          description: |
            Некорректный запрос. Коды ошибок:
            - `invalid_params` — нет поля `project` или `file`, неверный формат `project`;
            - `unsupported_manifest` — нет парсера для этого имени файла;
            - `invalid_idempotency_key` — ключ длиннее 255 символов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                missingField:
                  value:
                    error:
                      code: invalid_params
                      message: field is required
                      details: { field: project }
                unsupported:
                  value:
                    error:
                      code: unsupported_manifest
                      message: unsupported manifest file
                      details: { field: file, supported: [go.mod, package-lock.json] }
        '413':
          description: Файл больше 1 МБ, код `manifest_too_large`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: manifest_too_large
                  message: manifest is larger than 1 MB
                  details: { field: file, max_bytes: 1048576 }
        '422':
          description: Idempotency-Key уже использован с другим телом запроса, код `idempotency_key_reused`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: idempotency_key_reused
                  message: Idempotency-Key already used with a different request
                  details: { field: Idempotency-Key, scan_id: 0f8c2f0e-5c1b-4d0b-9b8e-3f2a1c7d9e10 }
        '500':
          $ref: '#/components/responses/Internal'

    get:
      tags: [scans]
      operationId: listScans
      summary: История сканов проекта
      description: Сканы проекта от новых к старым. Список постраничный.
      parameters:
        - name: project
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Значение `next_cursor` из предыдущего ответа.
          schema:
            type: string
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Страница истории.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanList'
        '400':
          description: Нет `project` или неверный `limit`/`cursor`, код `invalid_params`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/scans/{id}:
    get:
      tags: [scans]
      operationId: getScan
      summary: Состояние и отчёт скана
      description: |
        Пока скан не завершён, `findings` пустой. Отчёт заполнен для `done` и `partial`.
        Для `partial` в `unchecked` перечислены пакеты, которые проверить не удалось.
        Клиенту, который ждёт завершения, рекомендуется опрашивать не чаще раза в 2 секунды.
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Скан найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan'
        '404':
          $ref: '#/components/responses/ScanNotFound'
        '500':
          $ref: '#/components/responses/Internal'

  /v1/scans/{id}/cancel:
    post:
      tags: [scans]
      operationId: cancelScan
      summary: Отменить скан
      description: |
        Скан в `created` сразу переходит в `cancelled`.
        Выполняющийся скан помечается к отмене: обработка не прерывается, а по её завершении скан
        переходит в `cancelled` вместо `done` или `partial`, отчёт не публикуется.
        Повторная отмена уже помеченного скана возвращает тот же ответ `202`.
      parameters:
        - $ref: '#/components/parameters/ScanId'
        - $ref: '#/components/parameters/RequestId'
      responses:
        '202':
          description: Отмена принята.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAccepted'
        '404':
          $ref: '#/components/responses/ScanNotFound'
        '409':
          description: Скан уже в конечном состоянии, код `scan_finished`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: scan_finished
                  message: scan is already finished
                  details: { status: done }
        '500':
          $ref: '#/components/responses/Internal'

  /healthz:
    get:
      tags: [health]
      operationId: healthz
      summary: Процесс жив
      responses:
        '200':
          description: Сервис запущен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /readyz:
    get:
      tags: [health]
      operationId: readyz
      summary: Сервис готов принимать запросы
      description: Проверяет доступность хранилища.
      responses:
        '200':
          description: Хранилище доступно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Хранилище недоступно, код `storage_unavailable`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    ScanId:
      name: id
      in: path
      required: true
      description: Идентификатор скана (UUID).
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Ключ одной логической операции. Действует 24 часа в рамках `project`.
        Для CI рекомендуется `<проект>:<коммит>:<путь к манифесту>`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: payments-api:9f2c1e7a:go.mod
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Идентификатор запроса для логов. Если не передан, сервис создаёт его сам.
      schema:
        type: string
        maxLength: 64

  headers:
    XRequestId:
      description: Идентификатор запроса (correlation ID), по которому ищутся логи.
      schema:
        type: string

  responses:
    ScanNotFound:
      description: Скана с таким идентификатором нет, код `scan_not_found`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: scan_not_found
              message: scan not found
              details: { field: id }
    Internal:
      description: Внутренняя ошибка, код `internal`. Подробности — в логах по `X-Request-ID`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Машиночитаемый код ошибки.
              enum:
                - invalid_params
                - unsupported_manifest
                - manifest_too_large
                - invalid_idempotency_key
                - idempotency_key_reused
                - scan_not_found
                - scan_finished
                - storage_unavailable
                - internal
            message:
              type: string
              description: Описание для человека.
            details:
              type: object
              description: Подробности. Если ошибка связана с полем, его имя — в `field`.
              additionalProperties: true
              properties:
                field:
                  type: string

    ScanStatus:
      type: string
      enum: [created, parsing, querying, enriching, done, partial, failed, cancelled]

    Severity:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW, UNKNOWN]

    ScanCreated:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ScanStatus'
        created_at:
          type: string
          format: date-time

    CancelAccepted:
      type: object
      required: [id, status, cancel_requested]
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ScanStatus'
        cancel_requested:
          type: boolean

    Summary:
      type: object
      required: [packages, vulnerable, critical, high, medium, low, unknown]
      properties:
        packages: { type: integer, minimum: 0 }
        vulnerable: { type: integer, minimum: 0 }
        critical: { type: integer, minimum: 0 }
        high: { type: integer, minimum: 0 }
        medium: { type: integer, minimum: 0 }
        low: { type: integer, minimum: 0 }
        unknown: { type: integer, minimum: 0 }

    Finding:
      type: object
      required: [package, version, vuln_id, severity]
      properties:
        package: { type: string, example: golang.org/x/net }
        version: { type: string, example: 0.6.0 }
        vuln_id: { type: string, example: GO-2023-1571 }
        cve: { type: string, nullable: true, example: CVE-2022-41723 }
        summary: { type: string }
        severity:
          $ref: '#/components/schemas/Severity'
        cvss:
          type: object
          nullable: true
          properties:
            score: { type: number, example: 7.5 }
            vector: { type: string, example: 'CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:H' }
        fixed_version: { type: string, nullable: true, example: 0.7.0 }

    UncheckedPackage:
      type: object
      required: [package, reason]
      properties:
        package: { type: string }
        version: { type: string, nullable: true }
        reason:
          type: string
          enum: [vuln_source_unavailable, local_module]

    Scan:
      type: object
      required: [id, project, filename, status, created_at, findings, unchecked]
      properties:
        id: { type: string, format: uuid }
        project: { type: string }
        filename: { type: string, example: go.mod }
        status:
          $ref: '#/components/schemas/ScanStatus'
        cancel_requested: { type: boolean }
        error:
          type: object
          nullable: true
          description: Причина для `failed`.
          properties:
            code:
              type: string
              enum: [manifest_parse_error, vuln_source_unavailable, worker_lost, internal]
            message: { type: string, example: 'go.mod:7: unexpected token' }
        created_at: { type: string, format: date-time }
        checked_at:
          type: string
          format: date-time
          nullable: true
          description: Когда уязвимости проверялись в OSV.dev. Заполнено для `done` и `partial`.
        summary:
          allOf:
            - $ref: '#/components/schemas/Summary'
          nullable: true
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        unchecked:
          type: array
          items:
            $ref: '#/components/schemas/UncheckedPackage'

    ScanListItem:
      type: object
      required: [id, status, created_at]
      properties:
        id: { type: string, format: uuid }
        filename: { type: string }
        status:
          $ref: '#/components/schemas/ScanStatus'
        created_at: { type: string, format: date-time }
        checked_at: { type: string, format: date-time, nullable: true }
        summary:
          allOf:
            - $ref: '#/components/schemas/Summary'
          nullable: true

    ScanList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ScanListItem'
        next_cursor:
          type: string
          nullable: true
          description: Передать в `cursor`, чтобы получить следующую страницу. `null` — страниц больше нет.

    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
